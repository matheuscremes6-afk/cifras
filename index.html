<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cifrário</title>
<style>
:root{--bg:#faf6ee;--fg:#2a2320;--mut:#7a6d62;--card:#fff;--line:#e4dccd;--ac:#c2410c;--ch:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--fg:#efe6da;--mut:#a39485;--card:#241e1a;--line:#3a312a;--ac:#fb923c;--ch:#fbbf24}}
:root[data-theme="dark"]{--bg:#1a1613;--fg:#efe6da;--mut:#a39485;--card:#241e1a;--line:#3a312a;--ac:#fb923c;--ch:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
header{padding:20px 16px 8px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:1.7rem;letter-spacing:.02em}h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:.9rem;margin-top:2px}
main{max-width:900px;margin:0 auto;padding:8px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tom{font-weight:bold;min-width:5.5em;text-align:center}
.grp{display:flex;gap:6px;align-items:center}
.sp{flex:1}
h2{margin:6px 0 0;font-size:1.5rem}
.art{color:var(--mut);margin-bottom:10px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
pre{margin:0;font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;line-height:1.45;white-space:pre}
.c{color:var(--ch);font-weight:bold}.h{color:var(--ac);font-weight:bold}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(560px,92vw)}
dialog::backdrop{background:#0008}
label{display:block;margin:8px 0 2px;font-size:.85rem;color:var(--mut)}
input,textarea{width:100%}textarea{min-height:200px;font-family:Menlo,Consolas,monospace;font-size:.85rem}
.row{display:flex;gap:8px}.row>div{flex:1}
</style>
</head>
<body>
<header><h1>Cifr<span>ário</span></h1><div class="sub">Suas cifras, em qualquer tom.</div></header>
<main>
<div class="bar">
 <select id="sel" aria-label="Cifra"></select>
 <button id="add">+ Nova cifra</button>
 <span class="sp"></span>
 <div class="grp"><button id="dn" title="Descer meio tom">− ½</button><span class="tom" id="tom"></span><button id="up" title="Subir meio tom">+ ½</button></div>
 <select id="keysel" aria-label="Tom"></select>
 <button id="rs">Tom original</button>
 <div class="grp"><button id="fm">A−</button><button id="fp">A+</button></div>
</div>
<h2 id="t"></h2><div class="art" id="a"></div>
<div class="sheet"><pre id="o"></pre></div>
</main>
<dialog id="dlg"><form method="dialog" id="f">
<h3 style="margin-top:0">Nova cifra</h3>
<div class="row"><div><label>Música</label><input id="nt" required></div><div><label>Artista</label><input id="na"></div><div style="max-width:110px"><label>Tom (ex.: Dm)</label><input id="nk"></div></div>
<label>Cifra (acordes em cima da letra)</label><textarea id="nx" required></textarea>
<div class="row" style="margin-top:12px;justify-content:flex-end"><button value="cancel" formnovalidate>Cancelar</button><button class="p" id="ok" value="ok">Salvar</button></div>
</form></dialog>

const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const CH=/^([A-G][#b]?)((?:m|M|maj|dim|aug|sus|add|º|°|\+|-|\d|\(|\)|#|b)*)(?:\/([A-G][#b]?))?$/;
const FLATMIN=['D','G','C','F','Bb','Eb'],FLATMAJ=['F','Bb','Eb','Ab','Db','Gb'];
const mod=x=>((x%12)+12)%12;
const clean=s=>s.replace(/[\u200b-\u200d\u2060\ufeff\u00ad]/g,'').replace(/[\u00a0\u2000-\u200a\u202f\u3000]/g,' ').replace(/\r/g,'').replace(/\t/g,'    ').replace(/[♯]/g,'#').replace(/[♭]/g,'b');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let songs=[{id:'azul',title:'Azul',artist:'Djavan',key:'Dm',text:AZUL}];
try{const s=JSON.parse(localStorage.getItem('cifrario-extra')||'[]');if(Array.isArray(s))songs=songs.concat(s)}catch(e){}
let cur=songs[0],n=0,fs=15,flat=true;

function parseKey(k){const m=/^([A-G][#b]?)(m?)/.exec((k||'').trim());return m?{r:m[1],min:!!m[2]}:null}
function keyName(){const k=parseKey(cur.key);if(!k)return null;const r=mod(IX[k.r]+n);
 flat=k.min?FLATMIN.includes(SH[r])||FLATMIN.includes(FL[r]):FLATMAJ.includes(FL[r])&&!SH[r].includes('#')||FLATMAJ.includes(FL[r]);
 if(!k.min&&['G','D','A','E','B'].includes(SH[r]))flat=false;
 return (flat?FL:SH)[r]+(k.min?'m':'')}
function shTok(t){const m=CH.exec(t);if(!m)return t;const f=(a)=>(flat?FL:SH)[mod(IX[a]+n)];return f(m[1])+m[2]+(m[3]?'/'+f(m[3]):'')}
function isChord(t){return CH.test(t)}
function chordLine(s){const t=s.trim().split(/\s+/).filter(Boolean);return t.length>0&&t.every(x=>isChord(x)||/^[()|\/-]+$|^\(?\d+x\)?$|^x\d+$|^N\.?C\.?$/i.test(x))&&t.some(isChord)}
function shLine(s){let out='',m,re=/\S+/g;while(m=re.exec(s)){if(out.length<m.index)out+=' '.repeat(m.index-out.length);else if(out.length)out+=' ';out+=shTok(m[0])}return out}
function render(){
 const kn=keyName();
 const lines=clean(cur.text).split('\n').map(l=>{
  const h=/^(\s*\[[^\]]*\])(.*)$/.exec(l);
  if(h){if(!h[2].trim())return '<span class="h">'+esc(l)+'</span>';
   if(chordLine(h[2])){const body=shLine(' '.repeat(h[1].length)+h[2]).slice(h[1].length);return '<span class="h">'+esc(h[1])+'</span><span class="c">'+esc(body)+'</span>'}}
  if(chordLine(l))return '<span class="c">'+esc(shLine(l))+'</span>';
  return esc(l)});
 document.getElementById('o').innerHTML=lines.join('\n');
 document.getElementById('o').style.fontSize=fs+'px';
 document.getElementById('t').textContent=cur.title;
 document.getElementById('a').textContent=cur.artist||'';
 const ks=document.getElementById('keysel'),tm=document.getElementById('tom');
 tm.textContent=kn?'Tom: '+kn:(n===0?'Original':(n>0?'+':'')+n+' ½ tom');
 ks.style.display=kn?'':'none';
 if(kn){const k=parseKey(cur.key);ks.innerHTML=Array.from({length:12},(_,i)=>{const r=mod(IX[k.r]+i);const nm=(k.min?FLATMIN.includes(SH[r])||FLATMIN.includes(FL[r]):FLATMAJ.includes(FL[r]))?FL[r]:SH[r];return '<option value="'+i+'"'+(i===mod(n)?' selected':'')+'>'+nm+(k.min?'m':'')+(i===0?' (original)':'')+'</option>'}).join('')}
}
function setN(v){n=mod(v+6)-6;render()}
function fill(){const s=document.getElementById('sel');s.innerHTML=songs.map((x,i)=>'<option value="'+i+'"'+(x===cur?' selected':'')+'>'+esc(x.title)+'</option>').join('')}
document.getElementById('up').onclick=()=>setN(n+1);
document.getElementById('dn').onclick=()=>setN(n-1);
document.getElementById('rs').onclick=()=>setN(0);
document.getElementById('keysel').onchange=e=>setN(+e.target.value);
document.getElementById('fp').onclick=()=>{fs=Math.min(30,fs+1);render()};
document.getElementById('fm').onclick=()=>{fs=Math.max(9,fs-1);render()};
document.getElementById('sel').onchange=e=>{cur=songs[+e.target.value];n=0;render()};
const dlg=document.getElementById('dlg');
document.getElementById('add').onclick=()=>dlg.showModal();
document.getElementById('f').addEventListener('submit',e=>{
 if(e.submitter&&e.submitter.value!=='ok')return;
 const s={id:'u'+Date.now(),title:nt.value.trim(),artist:na.value.trim(),key:nk.value.trim(),text:nx.value.replace(/\r/g,'')};
 if(!s.title||!s.text.trim())return;
 songs.push(s);cur=s;n=0;
 try{localStorage.setItem('cifrario-extra',JSON.stringify(songs.slice(1)))}catch(err){}
 nt.value=na.value=nk.value=nx.value='';fill();render();
});
fill();render();
</script>
